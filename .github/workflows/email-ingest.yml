name: Email ingest

# The morning and evening check-ins.
#
# Vercel's Hobby plan allows two cron jobs, both daily, and the journal already
# spends them on the sync and housekeeping passes — so this beat lives here
# instead, where it costs nothing and does not depend on any machine being
# switched on. All it does is call the app; the work happens there.
#
# 07:00 UTC reads overnight mail before the session; 21:00 UTC reads the
# evening's and sends the day's summary, plus the week's wrap on a Friday.
# Each run reads a two-day window, so nothing falls between them.
#
# Needs two repository values (Settings -> Secrets and variables -> Actions):
#   CRON_SECRET  a Secret. Same value as the app's CRON_SECRET env var, and it
#                must be a Secret: a Variable is printed in plain text in logs.
#   JOURNAL_URL  https://your-journal.vercel.app - either tab works, since a URL
#                is not sensitive. A Variable wins if both exist.
#
# GitHub disables scheduled workflows in a repository with no activity for 60
# days. The daily Vercel cron keeps the automation alive if that ever happens.

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days of mail to read (use a bigger number to backfill)'
        required: false
        default: '2'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the inbox
        env:
          JOURNAL_URL: ${{ vars.JOURNAL_URL || secrets.JOURNAL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAYS: ${{ github.event.inputs.days || '2' }}
          # Which cron fired decides whether a summary follows the inbox read.
          # A manual run is treated as a morning check so testing the workflow
          # never fires an evening summary out of context.
          SLOT: ${{ github.event.schedule == '0 21 * * *' && 'evening' || 'morning' }}
        run: |
          if [ -z "$JOURNAL_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "JOURNAL_URL or CRON_SECRET is not set - add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          response=$(curl -sS --max-time 120 --retry 2 --retry-delay 10 \
            -w '\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${JOURNAL_URL%/}/api/cron/email?days=$DAYS&slot=$SLOT")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "$body"

          # Say what to do, not just what happened: these runs are unattended,
          # so the notification email is the whole diagnosis.
          case "$status" in
            200) ;;
            401)
              echo "::error::Journal rejected the token (HTTP 401). The CRON_SECRET secret in this repository does not match the CRON_SECRET environment variable in the app. Copy the value from Vercel (Settings > Environment Variables) into GitHub (Settings > Secrets and variables > Actions), or the other way round, then redeploy."
              exit 1 ;;
            404)
              echo "::error::No such endpoint (HTTP 404). Check JOURNAL_URL points at the deployed app root, with no trailing path."
              exit 1 ;;
            000)
              echo "::error::Could not reach $JOURNAL_URL at all. Check the URL and that the deployment is live."
              exit 1 ;;
            *)
              echo "::error::Journal returned HTTP $status."
              exit 1 ;;
          esac

          # The route reports its own failures as ok:false with a 200, so that a
          # retry never double-writes; surface that as a failed run.
          if ! echo "$body" | grep -q '"ok":true'; then
            echo "::error::The journal ran but reported a failure — see the JSON above. A mailbox that cannot be reached is the usual cause; Settings in the app shows the same message."
            exit 1
          fi
